name: CIPHER CI

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test (Windows)
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show SDK information
        shell: pwsh
        run: |
          dotnet --info
          dotnet --list-sdks

      - name: Restore solution
        run: dotnet restore CIPHER.sln

      - name: Build solution
        run: dotnet build CIPHER.sln --configuration Release --no-restore

      - name: Run tests
        run: >-
          dotnet test CIPHER.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=CIPHER.Tests.trx"
          --results-directory TestResults

      - name: Summarize test results
        if: always()
        shell: pwsh
        run: |
          $summaryPath = $env:GITHUB_STEP_SUMMARY
          "## CIPHER test results" | Out-File -FilePath $summaryPath -Encoding utf8
          $trx = Get-ChildItem -Path TestResults -Filter *.trx -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $trx) {
            "No TRX test report was produced." | Out-File -FilePath $summaryPath -Append -Encoding utf8
            exit 0
          }

          [xml]$report = Get-Content -LiteralPath $trx.FullName
          $counters = $report.SelectSingleNode("//*[local-name()='Counters']")
          if ($counters) {
            "Total: $($counters.total); Passed: $($counters.passed); Failed: $($counters.failed); Error: $($counters.error)" |
              Out-File -FilePath $summaryPath -Append -Encoding utf8
          }

          $failed = $report.SelectNodes("//*[local-name()='UnitTestResult' and @outcome!='Passed']")
          foreach ($result in $failed) {
            "" | Out-File -FilePath $summaryPath -Append -Encoding utf8
            "### FAILED: $($result.testName) ($($result.outcome))" |
              Out-File -FilePath $summaryPath -Append -Encoding utf8
            $message = $result.SelectSingleNode(".//*[local-name()='Message']")
            $messageText = if ($message) { $message.InnerText } else { "No failure message was recorded." }
            if ($message) {
              $message.InnerText | Out-File -FilePath $summaryPath -Append -Encoding utf8
            }

            $escapedTest = $result.testName.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            $escapedMessage = $messageText.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Failed test $escapedTest::$escapedMessage"
          }

      - name: Validate setup-dev.bat
        shell: cmd
        run: |
          call setup-dev.bat
          if errorlevel 2 exit /b 1
          exit /b 0

      - name: Validate build.bat
        shell: cmd
        run: |
          call build.bat Release
          if errorlevel 1 exit /b 1
          exit /b 0

      - name: Validate test.bat
        shell: cmd
        run: |
          call test.bat Release
          if errorlevel 1 exit /b 1
          exit /b 0

      - name: Validate package.bat gate
        shell: cmd
        run: |
          call package.bat Release
          if not errorlevel 1 (
            echo package.bat unexpectedly succeeded before the offline installer stage was complete.
            exit /b 1
          )
          echo package.bat correctly refused to create an installer before Stage 10 dependencies were ready.
          exit /b 0

      - name: Run Notepad milestone harness (experimental, non-interactive session)
        continue-on-error: true
        timeout-minutes: 3
        run: ./src/CIPHER.MilestoneTest/bin/Release/net10.0-windows/CIPHER.MilestoneTest.exe

      - name: Run Stage 4 element targeting harness (experimental, non-interactive session)
        continue-on-error: true
        timeout-minutes: 3
        run: ./src/CIPHER.MilestoneTest/bin/Release/net10.0-windows/CIPHER.MilestoneTest.exe stage4 --app ./src/CIPHER.App/bin/Release/net10.0-windows/win-x64/CIPHER.exe

      - name: Install Playwright Chromium for Stage 5 harness
        run: pwsh src/CIPHER.BrowserTest/bin/Release/net10.0/playwright.ps1 install chromium

      - name: Run Stage 5 browser harness (experimental, local test pages)
        continue-on-error: true
        timeout-minutes: 5
        run: ./src/CIPHER.BrowserTest/bin/Release/net10.0/CIPHER.BrowserTest.exe

      - name: Download Vosk test model (Stage 6)
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $modelRoot = Join-Path $env:RUNNER_TEMP "vosk-model"
          $zipPath = Join-Path $env:RUNNER_TEMP "vosk-model-small-en-us-0.15.zip"
          Invoke-WebRequest -Uri "https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip" -OutFile $zipPath
          Expand-Archive -LiteralPath $zipPath -DestinationPath $modelRoot -Force
          $modelDir = Join-Path $modelRoot "vosk-model-small-en-us-0.15"
          if (-not (Test-Path (Join-Path $modelDir "conf\model.conf"))) {
            throw "Vosk model download did not produce a usable model directory."
          }
          "CIPHER_VOSK_MODEL=$modelDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Vosk test model ready at $modelDir"

      - name: Generate wake-phrase test audio (Stage 6)
        continue-on-error: true
        timeout-minutes: 3
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Speech
          $format = New-Object System.Speech.AudioFormat.SpeechAudioFormatInfo(16000, [System.Speech.AudioFormat.AudioBitsPerSample]::Sixteen, [System.Speech.AudioFormat.AudioChannel]::Mono)
          $synth = New-Object System.Speech.Synthesis.SpeechSynthesizer
          try {
            $wavPath = Join-Path $env:RUNNER_TEMP "cipher-wake-test.wav"
            $synth.SetOutputToWaveFile($wavPath, $format)
            $synth.Speak("Hey Cipher, what time is it?")
            "CIPHER_VOICE_WAV=$wavPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "Generated test speech at $wavPath"
          } finally {
            $synth.Dispose()
          }

      - name: Download eSpeak NG (Stage 6)
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $headers = @{ "User-Agent" = "CIPHER-CI" }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/espeak-ng/espeak-ng/releases/latest" -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -like "*.msi" } | Select-Object -First 1
          if (-not $asset) { throw "No eSpeak NG MSI asset found in the latest release." }
          $msiPath = Join-Path $env:RUNNER_TEMP "espeak-ng.msi"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $msiPath -Headers $headers
          $extractDir = Join-Path $env:RUNNER_TEMP "espeak-ng"
          $proc = Start-Process msiexec.exe -ArgumentList "/a `"$msiPath`" /qn TARGETDIR=`"$extractDir`"" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "msiexec administrative install failed with exit code $($proc.ExitCode)." }
          $exe = Get-ChildItem -Path $extractDir -Recurse -Filter "espeak-ng.exe" | Select-Object -First 1
          if (-not $exe) { throw "espeak-ng.exe was not found in the extracted MSI." }
          "CIPHER_ESPEAK_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "eSpeak NG ready at $($exe.FullName)"

      - name: Run Stage 6 voice harness (experimental, generated audio)
        continue-on-error: true
        timeout-minutes: 5
        run: ./src/CIPHER.VoiceTest/bin/Release/net10.0-windows/CIPHER.VoiceTest.exe

      - name: Stage 7 memory harness - write phase (simulated kill)
        shell: pwsh
        run: |
          $db = Join-Path $env:RUNNER_TEMP "cipher-stage7-memory.db"
          ./src/CIPHER.MemoryTest/bin/Release/net10.0/CIPHER.MemoryTest.exe --write --db $db
          if ($LASTEXITCODE -ne 0) { throw "Stage 7 write phase failed with exit code $LASTEXITCODE." }

      - name: Stage 7 memory harness - restart and verify recovery
        shell: pwsh
        run: |
          $db = Join-Path $env:RUNNER_TEMP "cipher-stage7-memory.db"
          ./src/CIPHER.MemoryTest/bin/Release/net10.0/CIPHER.MemoryTest.exe --verify --db $db
          if ($LASTEXITCODE -ne 0) { throw "Stage 7 recovery verification failed with exit code $LASTEXITCODE." }

      - name: Run Stage 8 delegation harness (loopback fake AI endpoint)
        timeout-minutes: 5
        shell: pwsh
        run: |
          ./src/CIPHER.DelegationTest/bin/Release/net10.0/CIPHER.DelegationTest.exe
          if ($LASTEXITCODE -ne 0) { throw "Stage 8 delegation harness failed with exit code $LASTEXITCODE." }

      - name: Stage 9 audit harness - write phase
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "cipher-stage9-audit.log"
          ./src/CIPHER.SecurityTest/bin/Release/net10.0/CIPHER.SecurityTest.exe --write --log $log
          if ($LASTEXITCODE -ne 0) { throw "Stage 9 audit write phase failed with exit code $LASTEXITCODE." }

      - name: Stage 9 audit harness - verify chain, redaction, tamper evidence
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "cipher-stage9-audit.log"
          ./src/CIPHER.SecurityTest/bin/Release/net10.0/CIPHER.SecurityTest.exe --verify --log $log
          if ($LASTEXITCODE -ne 0) { throw "Stage 9 audit verification failed with exit code $LASTEXITCODE." }

      - name: Run Stage 9 security gate harness (quarantine recovery)
        timeout-minutes: 3
        shell: pwsh
        run: |
          ./src/CIPHER.MilestoneTest/bin/Release/net10.0-windows/CIPHER.MilestoneTest.exe stage9
          if ($LASTEXITCODE -ne 0) { throw "Stage 9 security gate harness failed with exit code $LASTEXITCODE." }

      - name: Cache staged dependencies (Stage 10)
        uses: actions/cache@v4
        with:
          path: |
            dependencies/vosk
            dependencies/espeak-ng
            dependencies/playwright
            dependencies/licenses
            dependencies/manifest.sha256
          key: cipher-deps-${{ hashFiles('scripts/stage-dependencies.ps1') }}

      - name: Stage offline dependencies (Stage 10)
        timeout-minutes: 10
        shell: pwsh
        run: |
          # The script fails the step itself on any error ($ErrorActionPreference
          # is Stop inside it); $LASTEXITCODE only tracks native commands.
          ./scripts/stage-dependencies.ps1

      - name: Build CIPHER.msi via package.bat (Stage 10)
        timeout-minutes: 20
        shell: pwsh
        run: |
          cmd /c "package.bat Release"
          if ($LASTEXITCODE -ne 0) {
            foreach ($log in @("logs/package-Release.log", "logs/install-dependencies.log")) {
              if (Test-Path $log) {
                $tail = (Get-Content $log -Tail 20) -join "`n"
                $escaped = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                Write-Host "::error title=package.bat log::$escaped"
              }
            }
            throw "package.bat failed with exit code $LASTEXITCODE."
          }

      - name: Verify MSI payload by administrative extraction (Stage 10)
        timeout-minutes: 10
        shell: pwsh
        run: |
          $extract = Join-Path $env:RUNNER_TEMP "cipher-msi-extract"
          $found = Get-ChildItem -Path $PWD -Recurse -Filter "CIPHER.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          $msiPath = Join-Path $PWD "artifacts\CIPHER.msi"
          if (-not (Test-Path $msiPath) -and $found) {
            $msiPath = $found.FullName
            Write-Host "::notice title=MSI location::Using MSI found at $msiPath"
          }
          if (-not (Test-Path $msiPath)) {
            Write-Host "::error title=MSI payload::CIPHER.msi not found at $msiPath (PWD=$PWD)"
            throw "CIPHER.msi not found at $msiPath."
          }
          Write-Host "::notice title=MSI payload::CIPHER.msi size: $((Get-Item $msiPath).Length) bytes"
          $proc = Start-Process msiexec.exe -ArgumentList "/a `"$msiPath`" /qn TARGETDIR=`"$extract`"" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            Write-Host "::error title=MSI payload::Administrative extraction exit code $($proc.ExitCode) for $msiPath"
            throw "MSI administrative extraction failed with exit code $($proc.ExitCode)."
          }
          $root = Get-ChildItem -Path $extract -Recurse -Filter "CIPHER.exe" | Select-Object -First 1
          if (-not $root) {
            $listing = (Get-ChildItem -Path $extract -Recurse -File | Select-Object -First 20 -ExpandProperty FullName) -join "`n"
            $escaped = $listing.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=MSI extract listing::$escaped"
            throw "CIPHER.exe not found in the extracted MSI."
          }
          $installDir = $root.DirectoryName
          foreach ($relative in @(
            "models\vosk-model-small-en-us-0.15\conf\model.conf",
            "tools\espeak-ng\espeak-ng.exe",
            "licenses\LICENSE-VOSK.txt",
            "licenses\LICENSE-ESPEAK-NG.txt",
            "licenses\LICENSE-PLAYWRIGHT.txt")) {
            if (-not (Test-Path (Join-Path $installDir $relative))) {
              Write-Host "::error title=MSI payload::Missing from MSI payload: $relative (install dir: $installDir)"
              throw "Missing from MSI payload: $relative"
            }
          }
          $chrome = Get-ChildItem -Path (Join-Path $installDir "playwright\browsers") -Recurse -Filter "chrome.exe" | Select-Object -First 1
          if (-not $chrome) {
            Write-Host "::error title=MSI payload::Bundled Chromium (chrome.exe) not found under $installDir\playwright\browsers"
            throw "Bundled Chromium (chrome.exe) not found in the extracted MSI."
          }
          Write-Host "MSI payload verified under $installDir"

      - name: Install and uninstall CIPHER.msi (Stage 10)
        timeout-minutes: 10
        shell: pwsh
        run: |
          $install = Start-Process msiexec.exe -ArgumentList "/i `"$PWD\artifacts\CIPHER.msi`" /qn /norestart" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "MSI install failed with exit code $($install.ExitCode)." }
          $exe = Join-Path $env:LOCALAPPDATA "CIPHERProgram\CIPHER.exe"
          if (-not (Test-Path $exe)) { throw "Installed CIPHER.exe not found at $exe" }
          $shortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\CIPHER.lnk"
          if (-not (Test-Path $shortcut)) { throw "Start menu shortcut not found at $shortcut" }
          Write-Host "Installed CIPHER verified; uninstalling."
          $uninstall = Start-Process msiexec.exe -ArgumentList "/x `"$PWD\artifacts\CIPHER.msi`" /qn /norestart" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "MSI uninstall failed with exit code $($uninstall.ExitCode)." }
          if (Test-Path (Join-Path $env:LOCALAPPDATA "CIPHERProgram")) { throw "CIPHERProgram folder remained after uninstall." }

      - name: Publish Windows x64 app (framework-dependent validation build)
        run: >-
          dotnet publish src/CIPHER.App/CIPHER.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output artifacts/CIPHER-validation

      - name: Upload validation build
        uses: actions/upload-artifact@v4
        with:
          name: CIPHER-validation-build
          path: artifacts/CIPHER-validation
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CIPHER-test-results
          path: TestResults
          if-no-files-found: warn
