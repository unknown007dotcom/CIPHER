name: CIPHER CI

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test (Windows)
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show SDK information
        shell: pwsh
        run: |
          dotnet --info
          dotnet --list-sdks

      - name: Restore solution
        run: dotnet restore CIPHER.sln

      - name: Build solution
        run: dotnet build CIPHER.sln --configuration Release --no-restore

      - name: Run tests
        run: >-
          dotnet test CIPHER.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=CIPHER.Tests.trx"
          --results-directory TestResults

      - name: Publish Windows x64 app (framework-dependent validation build)
        run: >-
          dotnet publish src/CIPHER.App/CIPHER.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output artifacts/CIPHER-validation

      - name: Upload validation build
        uses: actions/upload-artifact@v4
        with:
          name: CIPHER-validation-build
          path: artifacts/CIPHER-validation
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CIPHER-test-results
          path: TestResults
          if-no-files-found: warn
